<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inventory | Counterpoint</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { padding: 35px; }
    .shell { max-width: 1100px; margin: auto; }
    .page-card { background:#fff; border:1px solid #e3e8e1; padding:26px; border-radius:12px; }
    .form-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .form-grid label { display:grid; gap:5px; font-size:11px; color:#76817a; }
    .form-grid input, .form-grid select { border:1px solid #e3e8e1; padding:10px; border-radius:6px; }
    .table { margin-top: 24px; }
    .row { display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:10px; border-top:1px solid #e3e8e1; padding:12px 0; font-size:12px; align-items:center; }
    .row button { background:none; color:#ee8753; margin-right:8px; }
    .row small { display:block; color:#76817a; }
    .filters { display:flex; gap:10px; align-items:end; }
    .filters label { display:grid; gap:5px; font-size:11px; }
    .metrics { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
    .metrics div, .summary { background:#f6f7f3; padding:15px; border-radius:8px; }
    .metrics span { display:block; color:#76817a; font-size:11px; }
    .metrics strong { font:600 20px 'Space Grotesk'; }
    .login { max-width:380px; margin:14vh auto; background:#fff; padding:28px; border:1px solid #e3e8e1; border-radius:12px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body data-page="inventory">
  <div id="login" class="login">
    <h2>Admin login</h2>
    <form id="login-form">
      <div class="form-grid">
        <label>Username<input name="username" value="admin" required /></label>
        <label>Password<input name="password" type="password" required /></label>
      </div>
      <br /><button class="tool-btn primary" style="padding:10px 18px;background:#245c45;color:#fff;border-radius:6px">Sign in</button>
    </form>
  </div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">+</span><span>counterpoint</span></div>
      <nav>
        <a href="/"><span>⌁</span> New sale</a>
        <a href="/products.html"><span>□</span> Products</a>
        <a href="/sales.html"><span>↗</span> Sales history</a>
        <a class="active" href="/inventory.html"><span>⚙</span> Admin</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div><p class="eyebrow">ADMINISTRATION</p><h1>Inventory</h1></div>
        <a href="/" class="tool-btn">Back to sale</a>
      </header>
      <div id="content"></div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/page.js"></script>
</body>
</html>
