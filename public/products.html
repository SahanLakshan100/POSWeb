<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Products | Counterpoint</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { padding: 35px; }
    .shell { max-width: 1100px; margin: auto; }
    .page-card { background:#fff; border:1px solid #e3e8e1; padding:26px; border-radius:12px; }
    .row { display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; border-top:1px solid #e3e8e1; padding:13px 0; font-size:12px; }
    .row small { display:block; color:#76817a; }
    .login { background:#fff; padding:25px; max-width:380px; margin:15vh auto; border:1px solid #e3e8e1; border-radius:12px; }
    .form-grid { display:grid; gap:10px; }
    .form-grid label { display:grid; gap:5px; font-size:12px; }
    .form-grid input { padding:10px; border:1px solid #e3e8e1; border-radius:6px; }
    .tool-btn { padding:10px 18px; border:0; border-radius:6px; }
    .primary { background:#245c45; color:#fff; }
    [hidden] { display:none !important; }
  </style>
</head>
<body data-page="products">
  <div id="login" class="login">
    <h2>Admin login</h2>
    <form id="login-form">
      <div class="form-grid">
        <label>Username<input name="username" value="admin" required /></label>
        <label>Password<input name="password" type="password" required /></label>
      </div>
      <br /><button class="tool-btn primary">Sign in</button>
    </form>
  </div>
  <div class="shell">
    <p><a href="/">← New sale</a> · <a href="/inventory.html">Admin inventory</a> · <a href="/sales.html">Sales history</a></p>
    <h1>Products</h1>
    <div id="content"></div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/page.js"></script>
</body>
</html>
