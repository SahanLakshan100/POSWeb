<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sales History | Counterpoint</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { padding: 35px; }
    .shell { max-width: 1100px; margin: auto; }
    .page-card { background:#fff; border:1px solid #e3e8e1; padding:26px; border-radius:12px; }
    .filters { display:flex; gap:12px; align-items:end; }
    .filters label { display:grid; gap:5px; font-size:12px; }
    .filters input { padding:10px; border:1px solid #e3e8e1; border-radius:6px; }
    .row { display:grid; grid-template-columns:1fr 1fr 1.5fr 1fr; border-top:1px solid #e3e8e1; padding:13px 0; font-size:12px; }
    .summary { margin:18px 0; padding:15px; background:#f6f7f3; border-radius:8px; }
    .login { background:#fff; padding:25px; max-width:380px; margin:15vh auto; border:1px solid #e3e8e1; border-radius:12px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body data-page="sales">
  <div id="login" class="login">
    <h2>Admin login</h2>
    <form id="login-form">
      <div class="form-grid">
        <label>Username<input name="username" value="admin" required /></label>
        <label>Password<input name="password" type="password" required /></label>
      </div>
      <br /><button class="tool-btn primary" style="padding:10px 18px;background:#245c45;color:#fff;border:0;border-radius:6px">Sign in</button>
    </form>
  </div>
  <div class="shell">
    <p><a href="/">← New sale</a> · <a href="/products.html">Products</a> · <a href="/inventory.html">Admin</a></p>
    <h1>Sales history</h1>
    <div id="content"></div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/page.js"></script>
</body>
</html>
